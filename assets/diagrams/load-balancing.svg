<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">把请求分给多台应用服务器</title><desc id="desc">负载均衡分配请求；增加应用实例仍需关注共享依赖的容量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">把请求分给多台应用服务器</text>
<text x="30" y="65" fill="#52685b" font-size="12">负载均衡分配请求；增加应用实例仍需关注共享依赖的容量。</text><g><rect x="30" y="185" width="130" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="95.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">用户</text><text x="95.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">同一个访问入口</text></g><g><rect x="250" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="330.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">负载均衡器</text><text x="330.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">轮询 / 其他策略</text></g><g><rect x="530" y="95" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="124" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App 1</text><text x="610.0" y="148" text-anchor="middle" fill="#52685b" font-size="12">可替换的应用实例</text></g><g><rect x="530" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App 2</text><text x="610.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">可替换的应用实例</text></g><g><rect x="530" y="275" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="304" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App 3</text><text x="610.0" y="328" text-anchor="middle" fill="#52685b" font-size="12">可替换的应用实例</text></g><path d="M160,221 L250,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M410,221 L530,131" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M410,221 L530,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M410,221 L530,311" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
