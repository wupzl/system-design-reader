<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">多数派确认，让提交的历史保持一致</title><desc id="desc">三节点示意：当前任期日志经多数派确认并满足规则后提交。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">多数派确认，让提交的历史保持一致</text>
<text x="30" y="65" fill="#52685b" font-size="12">三节点示意：当前任期日志经多数派确认并满足规则后提交。</text><g><rect x="30" y="180" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="209" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Client</text><text x="110.0" y="233" text-anchor="middle" fill="#52685b" font-size="12">发送命令 / 等待应用</text></g><g><rect x="280" y="180" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="209" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Leader A</text><text x="360.0" y="233" text-anchor="middle" fill="#52685b" font-size="12">当前任期日志</text></g><g><rect x="530" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Follower B</text><text x="610.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">持久化日志并确认</text></g><g><rect x="530" y="250" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="279" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Follower C</text><text x="610.0" y="303" text-anchor="middle" fill="#52685b" font-size="12">允许暂时落后</text></g><path d="M190,216 L280,216" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,216 L530,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="171.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">复制</text><path d="M440,216 L530,286" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="485.0" y="241.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">复制</text><path d="M530,182 L440,242" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="202.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">B 确认</text><text x="280" y="335" fill="#244f3d" font-size="13">A + B = 2 / 3；选举、日志新旧与任期规则同样必要。</text></g></svg>
