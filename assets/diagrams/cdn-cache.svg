<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">让静态资源靠近读者</title><desc id="desc">命中边缘缓存时直接响应；未命中时按配置回源并缓存。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">让静态资源靠近读者</text>
<text x="30" y="65" fill="#52685b" font-size="12">命中边缘缓存时直接响应；未命中时按配置回源并缓存。</text><g><rect x="30" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">浏览器</text><text x="110.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">先检查本地缓存</text></g><g><rect x="280" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">CDN 边缘节点</text><text x="360.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">接近访问者的缓存</text></g><g><rect x="530" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">源站</text><text x="610.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">静态资源 / 应用服务</text></g><path d="M190,221 L280,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="235.0" y="211.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">请求</text><path d="M440,221 L530,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="211.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">未命中时回源</text><path d="M610,257 L610,310" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,310 L360,310" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="300.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">回源内容按缓存策略存储</text><path d="M360,310 L360,257" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
