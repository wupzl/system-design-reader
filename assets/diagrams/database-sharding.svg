<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">数据分片：先找到数据，再访问分片</title><desc id="desc">分片键决定路由；同一分片可以再配置自己的主库与副本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">数据分片：先找到数据，再访问分片</text>
<text x="30" y="65" fill="#52685b" font-size="12">分片键决定路由；同一分片可以再配置自己的主库与副本。</text><g><rect x="30" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App</text><text x="110.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">携带 user_id 等分片键</text></g><g><rect x="280" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">分片路由</text><text x="360.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">按路由规则定位</text></g><g><rect x="530" y="95" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="124" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">DB 0</text><text x="610.0" y="148" text-anchor="middle" fill="#52685b" font-size="12">保存部分业务数据</text></g><g><rect x="530" y="185" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="214" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">DB 1</text><text x="610.0" y="238" text-anchor="middle" fill="#52685b" font-size="12">保存部分业务数据</text></g><g><rect x="530" y="275" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="304" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">DB 2</text><text x="610.0" y="328" text-anchor="middle" fill="#52685b" font-size="12">保存部分业务数据</text></g><path d="M190,221 L280,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,221 L530,131" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,221 L530,221" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,221 L530,311" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
