<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">熔断器的三个状态</title><desc id="desc">熔断减少持续故障的放大；恢复由受控探测决定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="360" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">熔断器的三个状态</text>
<text x="30" y="65" fill="#52685b" font-size="12">熔断减少持续故障的放大；恢复由受控探测决定。</text><g><rect x="30" y="170" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="199" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Closed · 关闭</text><text x="110.0" y="223" text-anchor="middle" fill="#52685b" font-size="12">正常放行并统计失败</text></g><g><rect x="280" y="170" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="199" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Open · 打开</text><text x="360.0" y="223" text-anchor="middle" fill="#52685b" font-size="12">快速失败 / 使用降级</text></g><g><rect x="530" y="170" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="199" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Half-open · 半开</text><text x="610.0" y="223" text-anchor="middle" fill="#52685b" font-size="12">放行少量探测请求</text></g><path d="M190,206 L280,206" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="235.0" y="196.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">达到阈值</text><path d="M440,206 L530,206" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="196.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">等待窗口到期</text><path d="M610,242 L610,300" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,300 L110,300" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="290.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">探测成功：恢复关闭</text><path d="M110,300 L110,242" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,170 L610,110" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,110 L360,110" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="100.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">探测失败：重新打开</text><path d="M360,110 L360,170" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
