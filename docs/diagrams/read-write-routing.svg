<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">读写分离：路由与复制是两条路径</title><desc id="desc">写入和强一致要求的读取走主库；允许延迟的读取可走副本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">读写分离：路由与复制是两条路径</text>
<text x="30" y="65" fill="#52685b" font-size="12">写入和强一致要求的读取走主库；允许延迟的读取可走副本。</text><g><rect x="30" y="180" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="209" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App</text><text x="110.0" y="233" text-anchor="middle" fill="#52685b" font-size="12">按读写需求路由</text></g><g><rect x="280" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Primary</text><text x="360.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">写入 / 必要的读取</text></g><g><rect x="280" y="250" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="279" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Replica</text><text x="360.0" y="303" text-anchor="middle" fill="#52685b" font-size="12">允许复制延迟的读取</text></g><g><rect x="530" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">binlog</text><text x="610.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">源库变更日志</text></g><g><rect x="530" y="250" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="279" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">relay log</text><text x="610.0" y="303" text-anchor="middle" fill="#52685b" font-size="12">接收后按顺序应用</text></g><path d="M190,216 L280,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="235.0" y="171.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">写 / 读</text><path d="M190,216 L280,286" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="235.0" y="241.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">读</text><path d="M440,146 L530,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,182 L610,250" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="610.0" y="206.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">复制</text><path d="M530,286 L440,286" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="276.0" text-anchor="middle" fill="#52685b" font-size="12" paint-order="stroke" stroke="#fff" stroke-width="5">应用</text></g></svg>
