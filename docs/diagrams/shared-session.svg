<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">把会话状态移出应用内存</title><desc id="desc">两台应用读取同一份会话；应用实例不再独占登录状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507f63"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#244f3d" font-size="20" font-weight="700">把会话状态移出应用内存</text>
<text x="30" y="65" fill="#52685b" font-size="12">两台应用读取同一份会话；应用实例不再独占登录状态。</text><g><rect x="30" y="180" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="209" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">负载均衡器</text><text x="110.0" y="233" text-anchor="middle" fill="#52685b" font-size="12">请求可以进入任意实例</text></g><g><rect x="280" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App A</text><text x="360.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">不在本机保存会话</text></g><g><rect x="280" y="250" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="279" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">App B</text><text x="360.0" y="303" text-anchor="middle" fill="#52685b" font-size="12">不在本机保存会话</text></g><g><rect x="530" y="180" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="209" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Redis</text><text x="610.0" y="233" text-anchor="middle" fill="#52685b" font-size="12">共享会话 / 设置 TTL</text></g><path d="M190,216 L280,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M190,216 L280,286" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,146 L530,216" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,286 L530,216" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
