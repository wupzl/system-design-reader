<text x="30" y="65" fill="#52685b" font-size="12">受理、可靠投递与最终业务成功，是需要分别确认的阶段。</text><g><rect x="30" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">请求入口</text><text x="110.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">限流 / 校验</text></g><g><rect x="280" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">库存预占</text><text x="360.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">原子操作 / 过期回收</text></g><g><rect x="530" y="110" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="139" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">MQ</text><text x="610.0" y="163" text-anchor="middle" fill="#52685b" font-size="12">确认 / 持久化 / 重试</text></g><g><rect x="530" y="260" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="610.0" y="289" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">Consumer</text><text x="610.0" y="313" text-anchor="middle" fill="#52685b" font-size="12">控制并发 / 幂等处理</text></g><g><rect x="280" y="260" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="360.0" y="289" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">数据库</text><text x="360.0" y="313" text-anchor="middle" fill="#52685b" font-size="12">业务事务 / 最终状态</text></g><g><rect x="30" y="260" width="160" height="72" rx="9" fill="#f4f8f5" stroke="#b0c9b9"/><text x="110.0" y="289" text-anchor="middle" fill="#244f3d" font-size="16" font-weight="600">查询结果</text><text x="110.0" y="313" text-anchor="middle" fill="#52685b" font-size="12">已受理 ≠ 已成单</text></g><path d="M190,146 L280,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,146 L530,146" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M610,182 L610,260" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M530,296 L440,296" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/><path d="M280,296 L190,296" fill="none" stroke="#507f63" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
